<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversor de Moedas</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <img src="./assets/logo.gif" class="logo" alt="logo conversor de moedas" />

    <main>
      <label>
        converter <b> de </b>
        <select>
          <option>R$ Real Brasileiro</option>
        </select>
      </label>

      <label>
        converter <b> para </b>
        <select class="currency-select">
          <option value="dolar">U$ Dólar Americano</option>
          <option value="libra"> Libra </option>
          <option value="euro">€ Euro</option>
        </select>
      </label>

      <label>
        valor
        <input class="input-currency" placeholder="R$100,00" type="number" />
      </label>
      <button class="convertButton">Converter</button>
      <section>
        <div class="currency-box">
          <img src="assets/brasil 2.png" alt="moeda a converter" />
          <p class="currency">Real</p>
          <p class="currency-value-to-convert">R$ 0,00</p>
        </div>

        <img class="arrow" src="assets/Vector.png" alt="seta de converção" />

        <div class="currency-box">
          <img
            class="currency-img"
            src="./assets/dolar.png"
            alt="moeda a convertida"
          />
          <p id="currency-name" class="currency">Dólar Americano</p>
          <p class="currency-value-converted">US$ 0.0</p>
        </div>
      </section>
    </main>
  </body>
</html>
